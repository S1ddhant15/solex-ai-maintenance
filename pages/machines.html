<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Library</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo-area">

<h2>🤖 SAMA</h2>

<p>AI Maintenance Assistant</p>

</div>

<ul>

<li onclick="location.href='../dashboard.html'">
<i class="fa-solid fa-chart-line"></i>
<span>Dashboard</span>
</li>

<li class="active">
<i class="fa-solid fa-gears"></i>
<span>Machines</span>
</li>

<li onclick="location.href='chat.html'">
<i class="fa-solid fa-comments"></i>
<span>AI Chat</span>
</li>

<li onclick="location.href='analytics.html'">
<i class="fa-solid fa-chart-column"></i>
<span>Analytics</span>
</li>

<li onclick="location.href='workorder.html'">
<i class="fa-solid fa-clipboard-list"></i>
<span>Work Orders</span>
</li>

<li onclick="location.href='notifications.html'">
<i class="fa-solid fa-bell"></i>
<span>Notifications</span>
</li>

<li onclick="location.href='settings.html'">
<i class="fa-solid fa-gear"></i>
<span>Settings</span>
</li>

<li onclick="logout()">
<i class="fa-solid fa-right-from-bracket"></i>
<span>Logout</span>
</li>

</ul>

</div>

<!-- Main Content -->

<div class="main-content">

<div class="topbar">

<div>

<h1>🏭 Machine Library</h1>

<p>Select any machine to view AI health details.</p>

</div>

</div>

<!-- Search -->

<div class="search-container">

<input
type="text"
id="machineSearch"
placeholder="🔍 Search Machine..."
onkeyup="searchMachines()">

</div>

<!-- Machine Cards -->

<div
class="cards"
id="machineContainer">

</div>

</div>

</div>

<script src="../js/app.js"></script>
<script src="../js/machines.js"></script>

</body>

</html>
