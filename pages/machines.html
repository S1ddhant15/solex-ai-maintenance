<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solex AI - Machine Library</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo-area">
            <h2>🤖 SAMA</h2>
            <p>AI Maintenance</p>
        </div>

        <ul>

            <li onclick="location.href='../dashboard.html'">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </li>

            <li class="active">
                <i class="fa-solid fa-gears"></i>
                Machines
            </li>

            <li onclick="location.href='chat.html'">
                <i class="fa-solid fa-comments"></i>
                AI Chat
            </li>

            <li onclick="location.href='alarms.html'">
                <i class="fa-solid fa-triangle-exclamation"></i>
                Alarm Lookup
            </li>

            <li onclick="location.href='pm.html'">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                Preventive Maintenance
            </li>

            <li onclick="location.href='settings.html'">
                <i class="fa-solid fa-gear"></i>
                Settings
            </li>

            <li onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </div>



    <!-- Main Content -->

    <div class="main-content">

        <div class="topbar">

            <div>

                <h1>Machine Library</h1>

                <p>Select a machine to view details</p>

            </div>

        </div>



        <!-- Search -->

        <div class="search-container">

            <input
            type="text"
            id="machineSearch"
            placeholder="🔍 Search Machine..."
            onkeyup="searchMachines()">

        </div>



        <!-- Machine Cards (Auto Loaded) -->

        <div
        class="cards"
        id="machineContainer">

        </div>


    </div>

</div>


<script src="../js/app.js"></script>

<script src="../js/machines.js"></script>

</body>

</html>
