<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SAMA - Solex AI Maintenance Assistant</title>


<link rel="stylesheet" href="../css/style.css">


<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
rel="stylesheet">


</head>


<body>


<div class="dashboard">



<!-- =========================
     SIDEBAR
========================= -->


<div class="sidebar">



<div class="logo-area">


<img 
src="../assets/solex-logo.png"
class="solex-logo"
alt="Solex Logo">


<h2>
🤖 SAMA
</h2>


<p>
AI Maintenance Assistant
</p>


</div>





<ul>


<li class="active">

<i class="fa-solid fa-robot"></i>

AI Chat

</li>





<li onclick="alert('Machine Status Coming Soon')">

<i class="fa-solid fa-gears"></i>

Machine Status

</li>





<li onclick="alert('Alarm History Coming Soon')">

<i class="fa-solid fa-triangle-exclamation"></i>

Alarm History

</li>





<li onclick="alert('PM Schedule Coming Soon')">

<i class="fa-solid fa-calendar-check"></i>

PM Schedule

</li>





<li onclick="alert('Spare Inventory Coming Soon')">

<i class="fa-solid fa-box"></i>

Spare Inventory

</li>





<li onclick="alert('Breakdown History Coming Soon')">

<i class="fa-solid fa-clock-rotate-left"></i>

Breakdown History

</li>





</ul>



</div>







<!-- =========================
     MAIN CONTENT
========================= -->


<div class="main-content">





<div class="topbar">


<h1>

🤖 Solex AI Maintenance Assistant

</h1>


</div>








<!-- CHAT AREA -->


<div class="chat-container">






<div class="chat-header">


🤖 SAMA


<span>

Online

🟢

</span>


</div>








<div id="chatBox" class="chat-box">



<!-- Messages will appear here -->



</div>









<div class="chat-input">



<input 


type="text"


id="userInput"


placeholder="Ask SAMA about machine, alarm, PM, spare..."


onkeypress="if(event.key==='Enter') sendMessage();"



>



<button onclick="sendMessage()">


<i class="fa-solid fa-paper-plane"></i>


Send


</button>




</div>






</div>







</div>


</div>








<!-- =========================
     JAVASCRIPT LOAD ORDER
========================= -->



<script src="../js/knowledge.js"></script>


<script src="../js/alarmDatabase.js"></script>


<script src="../js/spareDatabase.js"></script>


<script src="../js/breakdownHistory.js"></script>


<script src="../js/aiEngine.js"></script>


<script src="../js/chat.js"></script>



</body>

</html>
