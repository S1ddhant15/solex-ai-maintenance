<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solex AI Maintenance Assistant</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo-area">
<h2>🤖 SAMA</h2>
<p>AI Maintenance</p>
</div>

<ul>

<li onclick="location.href='../dashboard.html'">
<i class="fa-solid fa-house"></i>
Dashboard
</li>

<li onclick="location.href='machines.html'">
<i class="fa-solid fa-gears"></i>
Machines
</li>

<li class="active">
<i class="fa-solid fa-robot"></i>
AI Chat
</li>

<li onclick="location.href='alarms.html'">
<i class="fa-solid fa-triangle-exclamation"></i>
Alarm Lookup
</li>

<li onclick="location.href='pm.html'">
<i class="fa-solid fa-screwdriver-wrench"></i>
PM
</li>

<li onclick="logout()">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</li>

</ul>

</div>

<!-- Main -->

<div class="main-content">

<div class="topbar">

<h1>🤖 Solex AI Maintenance Assistant</h1>

</div>

<div class="chat-container">

<div id="chatBox" class="chat-box">

<div class="bot-message">

👋 Hello! I am <b>SAMA</b>.

Ask me anything about:

<br><br>

✅ Machine Breakdown

<br>

✅ Alarm Codes

<br>

✅ PM Checklist

<br>

✅ Spare Parts

<br>

✅ Troubleshooting

</div>

</div>

<div class="chat-input">

<input

type="text"

id="userInput"

placeholder="Ask about any machine..."

onkeypress="if(event.key==='Enter')sendMessage();">

<button onclick="sendMessage()">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

</div>

</div>

<script src="../js/database.js"></script>

<script src="../js/knowledge.js"></script>

<script src="../js/alarmDatabase.js"></script>

<script src="../js/chat.js"></script>

<script src="../js/app.js"></script>

</body>

</html>
