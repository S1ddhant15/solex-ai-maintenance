<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solex AI Analytics</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo-area">

<h2>🤖 SAMA</h2>

<p>AI Maintenance</p>

</div>

<ul>

<li onclick="location.href='home.html'">
<i class="fa fa-home"></i>
Home
</li>

<li onclick="location.href='dashboard.html'">
<i class="fa fa-chart-line"></i>
Dashboard
</li>

<li class="active">
<i class="fa fa-chart-pie"></i>
Analytics
</li>

<li onclick="location.href='chat.html'">
<i class="fa fa-comments"></i>
AI Chat
</li>

<li onclick="location.href='machines.html'">
<i class="fa fa-gears"></i>
Machines
</li>

<li onclick="location.href='workorder.html'">
<i class="fa fa-clipboard-list"></i>
Work Orders
</li>

<li onclick="location.href='settings.html'">
<i class="fa fa-cog"></i>
Settings
</li>

</ul>

</div>

<!-- Main -->

<div class="main-content">

<div class="topbar">

<div>

<h1>AI Maintenance Analytics</h1>

<p>Machine Performance & AI Insights</p>

</div>

</div>

<div class="cards">

<div class="card">

<h3>Total Machines</h3>

<h1>18</h1>

</div>

<div class="card">

<h3>Running</h3>

<h1>15</h1>

</div>

<div class="card">

<h3>Breakdown</h3>

<h1>2</h1>

</div>

<div class="card">

<h3>PM Due</h3>

<h1>5</h1>

</div>

</div>

<div class="recent">

<h2>Breakdown Trend</h2>

<canvas id="breakdownChart"></canvas>

</div>

<div class="recent">

<h2>Machine Availability</h2>

<canvas id="availabilityChart"></canvas>

</div>

</div>

</div>

<script>

new Chart(document.getElementById("breakdownChart"),{

type:'bar',

data:{

labels:['Mon','Tue','Wed','Thu','Fri','Sat'],

datasets:[{

label:'Breakdowns',

data:[3,2,5,1,4,2]

}]

}

});

new Chart(document.getElementById("availabilityChart"),{

type:'doughnut',

data:{

labels:['Running','Stopped'],

datasets:[{

data:[15,3]

}]

}

});

</script>

</body>

</html>
